<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7b6d0">
    <meta name="description" content="A birthday letter revealed after making a wish.">
    <title>A Birthday Letter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cards.css">
    <!-- Preload images in the background before the page renders -->
    <link rel="preload" as="image" href="photo-one.jpg">
    <link rel="preload" as="image" href="photo-two.jpg">
  </head>
  <body>
    <main class="cards-screen" aria-label="Birthday card deck">
      <p class="unlock-message">Your wish has been sent ✦</p>
      <section class="card-deck" aria-label="Birthday card deck">
        <div class="deck-layer layer-back" aria-hidden="true"></div>
        <div class="deck-layer layer-middle" aria-hidden="true"></div>
        <article class="story-card" id="story-card" aria-live="polite">
          <div class="card-media" id="card-media">
          </div>

          <div class="card-copy" id="card-copy"></div>
        </article>
      </section>
      <nav class="card-controls" aria-label="Card navigation">
        <button class="nav-button" id="previous-card" type="button" aria-label="Show previous card">‹</button>
        <span class="card-count" id="card-count">Card 1 of 3</span>
        <button class="nav-button" id="next-card" type="button" aria-label="Show next card">›</button>
      </nav>
    </main>
    <script src="cards.js" defer></script>
  </body>
</html>
